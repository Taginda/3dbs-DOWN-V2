<!DOCTYPE html>

<body>
  <header>
    <nav>
      <a href="#home"><img class="logo1" src="Resources/3dbs_Logo_01.png" alt="Band logo" /></a>

        <span></span>
        <span></span>

  <main>
    <section id="home">

    <section class="band-image">
    </section>

    <section class="band-image3">
    </section>

        <ul class="carousel">

    document.querySelector('.hamburger').addEventListener('click', function () {
